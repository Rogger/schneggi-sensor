name: Release firmware

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example 2.0.3 or v2.0.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firmware-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the release tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use a version tag such as 2.0.3 or v2.0.3.' >&2
            exit 1
          fi
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    uses: ./.github/workflows/main.yml
    with:
      source_ref: ${{ needs.source.outputs.commit }}

  publish:
    needs: [source, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: development-firmware-public-test-key
          path: build_release_assets
      - name: Verify assets and tag
        shell: bash
        run: |
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          cd build_release_assets
          sha256sum --check SHA256SUMS
      - name: Publish firmware assets
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft"; then
            if [[ $(cat "$RUNNER_TEMP/release-draft") != true ]]; then
              echo 'Release is already published; refusing to replace its firmware. Use a new version tag.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes \
              --notes-file build_release_assets/FIRMWARE.md
          fi
          # A failed upload leaves a draft; rerunning may replace its partial assets.
          gh release upload "$RELEASE_TAG" build_release_assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false

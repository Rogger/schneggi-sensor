name: Build debug and release
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit to test and build for a release
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Run host unit tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          cmake -S tests/unit -B tests/unit/build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build tests/unit/build
          ctest --test-dir tests/unit/build --output-on-failure

  build-firmware:
    runs-on: ubuntu-24.04
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain@sha256:45b97cad97a9967c52d77d1d1a0f7dd8fe027edd17c05c3eda2eeadc23729418 # v3.4.1
    defaults:
      run:
        # Bash shell is needed to set toolchain related environment variables in docker container
        # It is a workaround for GitHub Actions limitation https://github.com/actions/runner/issues/1964
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sensor
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
          
      - name: Prepare west project
        run: |
          west init -l sensor
          west update -o=--depth=1 -n
          python3 sensor/scripts/check_sdk.py "$PWD" sensor/west.yml
          mkdir -p sensor/build_sdk
          west manifest --freeze --active-only > sensor/build_sdk/west.yml

      - name: Build all firmware profiles
        working-directory: sensor
        run: |
          for profile in debug production; do
            for variant in co2 no_scd4x; do
              conf="prj_${profile}.conf"
              overlay="boards/schneggi_sensor.overlay"
              if [ "$variant" = no_scd4x ]; then
                conf="prj_${profile}_no_scd4x.conf"
                overlay="$overlay;boards/no_scd4x.overlay"
              fi
              west build --sysbuild -d "build_${profile}_${variant}" -b schneggi_sensor/nrf52840 . -- \
                -DNCS_TOOLCHAIN_VERSION=NONE -DBOARD_ROOT="$PWD" \
                -DOTA_ALLOW_TEST_KEY=ON \
                -DCONF_FILE="$conf" -DDTC_OVERLAY_FILE="$overlay"
            done
          done

      - name: Verify application signatures
        working-directory: sensor
        run: |
          for image in build_*/*/zephyr/zephyr.signed.bin; do
            python3 ../bootloader/mcuboot/scripts/imgtool.py verify \
              -k ../bootloader/mcuboot/root-ec-p256.pem "$image"
          done

      - name: Prepare downloadable release assets
        working-directory: sensor
        run: |
          python3 scripts/package_release.py \
            build_debug_co2 build_debug_no_scd4x build_production_co2 build_production_no_scd4x \
            --commit "$(git rev-parse HEAD)" --output build_release_assets
          cp build_sdk/west.yml build_release_assets/sdk-manifest.yml
          (cd build_release_assets && sha256sum sdk-manifest.yml >> SHA256SUMS)
      
      - name: Store firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-firmware-public-test-key
          path: sensor/build_release_assets/*
          if-no-files-found: error

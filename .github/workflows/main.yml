name: Build debug and release
on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Run host unit tests
        run: |
          cmake -S tests/unit -B tests/unit/build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build tests/unit/build
          ctest --test-dir tests/unit/build --output-on-failure

  build-firmware:
    runs-on: ubuntu-22.04
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:v2.9.2
    defaults:
      run:
        # Bash shell is needed to set toolchain related environment variables in docker container
        # It is a workaround for GitHub Actions limitation https://github.com/actions/runner/issues/1964
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: sensor
          
      - name: Prepare west project
        run: |
          west init -l sensor
          west update -o=--depth=1 -n

      - name: Build all firmware profiles
        working-directory: sensor
        run: |
          for profile in debug production; do
            for variant in co2 no_scd4x; do
              conf="prj_${profile}.conf"
              overlay="boards/adafruit_feather_nrf52840.overlay"
              if [ "$variant" = no_scd4x ]; then
                conf="prj_${profile}_no_scd4x.conf"
                overlay="$overlay;boards/no_scd4x.overlay"
              fi
              west build -d "build_${profile}_${variant}" -b adafruit_feather_nrf52840 . -- \
                -DNCS_TOOLCHAIN_VERSION=NONE -DBOARD_ROOT="$PWD" \
                -DCONF_FILE="$conf" -DDTC_OVERLAY_FILE="$overlay"
            done
          done
      
      - name: Store firmware
        uses: actions/upload-artifact@v4
        with:
          name: built-applications
          path: sensor/build_*/merged.hex
          if-no-files-found: error

CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
# MCUboot's base config selects minimal logging. Keep the framework enabled
# with every bootloader message compiled out to avoid conflicting choices.
CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_OFF=y
CONFIG_BOOT_ECDSA_NRF_OBERON=y
CONFIG_I2C=n
CONFIG_SPI=n
CONFIG_NORDIC_QSPI_NOR=n
CONFIG_BOOT_WATCHDOG_FEED=y

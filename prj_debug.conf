CONFIG_SENSOR_UPDATE_INTERVAL_MINUTES=1
CONFIG_ZIGBEE_LONG_POLL_INTERVAL_MS=60000
CONFIG_ZIGBEE_KEEPALIVE_TIMEOUT_MS=300000

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

CONFIG_ZIGBEE_APP_UTILS_LOG_LEVEL_DBG=y
CONFIG_ZBOSS_TRACE_LOG_LEVEL_DBG=n
CONFIG_ZBOSS_OSIF_LOG_LEVEL_DBG=n

CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7

# ZigBee
CONFIG_ZIGBEE=y
# Zigbee OTA / MCUboot
CONFIG_ZIGBEE_FOTA=y
CONFIG_ZIGBEE_FOTA_ENDPOINT=5
CONFIG_ZIGBEE_FOTA_MANUFACTURER_ID=0xFFF1
CONFIG_ZIGBEE_FOTA_HW_VERSION=1
# NCS periodic OTA queries omit hardware version; compatibility uses image type.
CONFIG_ENABLE_ZIGBEE_FOTA_MIN_HW_VERSION=n
CONFIG_ENABLE_ZIGBEE_FOTA_MAX_HW_VERSION=n
CONFIG_ZIGBEE_FOTA_PROGRESS_EVT=y
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="2.0.3"
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_DFU_TARGET_MCUBOOT=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_WATCHDOG=y
CONFIG_ZIGBEE_FOTA_IMAGE_TYPE=0x8102
CONFIG_ZIGBEE_FOTA_COMMENT="schneggi-debug-co2"
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_END_DEVICE=y
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y

# Sensor
CONFIG_SPI=n
CONFIG_PWM=n
CONFIG_ADC=n
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SHTCX=y
CONFIG_SCD4X=y

# This example requires more workqueue stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Enable API for powering down unused RAM parts
CONFIG_RAM_POWER_DOWN_LIBRARY=y

# Enable nRF ECB driver
CONFIG_CRYPTO=y
CONFIG_CRYPTO_NRF_ECB=y
CONFIG_CRYPTO_INIT_PRIORITY=80

# Networking
CONFIG_NET_IPV6=n
CONFIG_NET_IP_ADDR_CHECK=n

CONFIG_PM_DEVICE=y
